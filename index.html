<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGC 赛事档案馆 · AIGC Contest Archive</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* ===== 全局重置与变量 ===== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a26;
  --bg-card-hover: #22222f;
  --border: #2a2a3a;
  --border-light: #3a3a4f;
  --text-primary: #f0f0f5;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-glow: rgba(139, 92, 246, 0.3);
  --accent2: #06b6d4;
  --accent2-light: #22d3ee;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --radius-lg: 20px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 背景装饰 */
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ===== 导航栏 ===== */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}

.navbar-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text-primary);
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  color: white;
  letter-spacing: -0.5px;
}

.logo-text {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-link {
  padding: 8px 16px;
  border-radius: 8px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: var(--transition);
  cursor: pointer;
  border: none;
  background: none;
}

.nav-link:hover, .nav-link.active {
  color: var(--text-primary);
  background: var(--bg-card);
}

.nav-link.schedule-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
}

.schedule-badge {
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

/* ===== 主容器 ===== */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 24px;
  position: relative;
  z-index: 1;
}

/* ===== 首页 Hero ===== */
.hero {
  text-align: center;
  padding: 48px 0 40px;
}

.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-light) 50%, var(--accent2-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 32px;
}

/* ===== 搜索与筛选 ===== */
.search-section {
  margin-bottom: 32px;
}

.search-box {
  position: relative;
  max-width: 600px;
  margin: 0 auto 20px;
}

.search-input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 15px;
  transition: var(--transition);
  outline: none;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.filter-label {
  font-size: 13px;
  color: var(--text-muted);
}

.filter-select {
  padding: 7px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  outline: none;
  transition: var(--transition);
}

.filter-select:focus { border-color: var(--accent); }

.filter-select option { background: var(--bg-card); }

/* ===== 统计栏 ===== */
.stats-bar {
  display: flex;
  gap: 24px;
  justify-content: center;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-number {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== 比赛卡片网格 ===== */
.contest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
}

.contest-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}

.contest-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-light);
  box-shadow: var(--shadow-lg);
}

.contest-card-cover {
  height: 160px;
  position: relative;
  overflow: hidden;
}

.contest-card-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--bg-card) 0%, transparent 60%);
}

.contest-card-body {
  padding: 20px;
}

.contest-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.contest-card-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  flex: 1;
  margin-right: 10px;
}

.status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}

.status-open { background: rgba(16,185,129,0.15); color: var(--success); }
.status-upcoming { background: rgba(245,158,11,0.15); color: var(--warning); }
.status-closed { background: rgba(106,106,128,0.2); color: var(--text-muted); }

.contest-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.meta-tag {
  font-size: 12px;
  padding: 3px 8px;
  background: var(--bg-secondary);
  border-radius: 6px;
  color: var(--text-secondary);
}

.contest-card-prize {
  font-size: 13px;
  color: var(--accent-light);
  font-weight: 600;
  margin-bottom: 8px;
}

.contest-card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.contest-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.contest-card-date {
  font-size: 12px;
  color: var(--text-muted);
}

.add-schedule-btn {
  padding: 6px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 4px;
}

.add-schedule-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.add-schedule-btn.scheduled {
  background: rgba(139,92,246,0.2);
  border-color: var(--accent);
  color: var(--accent-light);
}

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 16px;
}

/* ===== 比赛详情页 ===== */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 24px;
}

.back-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-light);
}

.detail-header {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.detail-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}

.detail-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(24px, 4vw, 36px);
  font-weight: 900;
  margin-bottom: 12px;
  line-height: 1.3;
}

.detail-organizer {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.detail-prize {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-light);
  margin-bottom: 16px;
}

.detail-desc {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 20px;
}

.detail-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn-primary {
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 20px var(--accent-glow);
}

.btn-secondary {
  padding: 10px 24px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-secondary:hover {
  border-color: var(--border-light);
  background: var(--bg-card);
}

/* ===== 倒计时 ===== */
.countdown-box {
  background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.1));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  text-align: center;
}

.countdown-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.countdown-timer {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.countdown-unit {
  text-align: center;
}

.countdown-number {
  font-size: 32px;
  font-weight: 900;
  color: var(--accent-light);
  font-variant-numeric: tabular-nums;
}

.countdown-unit-label {
  font-size: 11px;
  color: var(--text-muted);
}

/* ===== 时间线 ===== */
.timeline-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  margin-bottom: 24px;
}

.section-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(to bottom, var(--accent), var(--accent2));
  border-radius: 2px;
}

.timeline {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 0;
  position: relative;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 100px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
  transform: translateX(-50%);
}

.timeline-item {
  display: contents;
}

.timeline-date {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 8px 16px 8px 0;
  text-align: right;
  position: relative;
}

.timeline-dot {
  position: absolute;
  right: -7px;
  top: 12px;
  width: 12px;
  height: 12px;
  background: var(--bg-card);
  border: 3px solid var(--accent);
  border-radius: 50%;
  z-index: 1;
}

.timeline-dot.completed {
  background: var(--success);
  border-color: var(--success);
}

.timeline-dot.current {
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.timeline-content {
  padding: 4px 0 20px 24px;
}

.timeline-content-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}

.timeline-content-desc {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 作品展示区 ===== */
.works-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
}

.works-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.collapse-all-btn {
  padding: 8px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.collapse-all-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-light);
}

.works-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.work-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}

.work-card:hover {
  border-color: var(--border-light);
}

.work-poster {
  position: relative;
  aspect-ratio: 16/9;
  cursor: pointer;
  overflow: hidden;
  background: var(--bg-card);
}

.work-poster-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.work-poster:hover .work-poster-img {
  transform: scale(1.05);
}

.work-poster-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px;
}

.work-award-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
}

.work-play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: var(--transition);
}

.work-poster:hover .work-play-icon {
  opacity: 1;
}

.work-info {
  padding: 14px 16px;
}

.work-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.work-author {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ===== 评论区 ===== */
.comments-panel {
  border-top: 1px solid var(--border);
  background: var(--bg-card);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}

.comments-panel.open {
  max-height: 500px;
}

.comments-inner {
  padding: 16px;
}

.comments-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.comments-count {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
}

.comment-toggle-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: var(--transition);
}

.comment-toggle-btn:hover {
  color: var(--text-primary);
  background: var(--bg-secondary);
}

.comment-input-area {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.comment-input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: var(--transition);
}

.comment-input:focus {
  border-color: var(--accent);
}

.comment-submit {
  padding: 8px 16px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.comment-submit:hover {
  background: #7c3aed;
}

.comments-list {
  max-height: 240px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.comments-list::-webkit-scrollbar { width: 4px; }
.comments-list::-webkit-scrollbar-track { background: transparent; }
.comments-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.comment-item {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 10px 12px;
}

.comment-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.comment-author {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-light);
}

.comment-time {
  font-size: 11px;
  color: var(--text-muted);
}

.comment-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  word-break: break-word;
}

.no-comments {
  text-align: center;
  padding: 16px;
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 我的赛程页 ===== */
.schedule-page {
  min-height: 60vh;
}

.schedule-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.schedule-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  transition: var(--transition);
}

.schedule-item:hover {
  border-color: var(--border-light);
}

.schedule-item-info {

const state = {

// ===== localStorage 操作 =====
const Storage = {
  getComments(workId) {
    const all = JSON.parse(localStorage.getItem('aigc_comments') || '{}');
    return all[workId] || [];
  },
  addComment(workId, text) {
    const all = JSON.parse(localStorage.getItem('aigc_comments') || '{}');
    if (!all[workId]) all[workId] = [];
    all[workId].unshift({
      id: Date.now(),
      text: text,
      author: '访客',
      time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    });
    localStorage.setItem('aigc_comments', JSON.stringify(all));
    return all[workId];
  },
  getSchedule() {
    return JSON.parse(localStorage.getItem('aigc_schedule') || '[]');
  },
  addToSchedule(contestId) {
    const list = this.getSchedule();
    if (!list.includes(contestId)) {
      list.push(contestId);
      localStorage.setItem('aigc_schedule', JSON.stringify(list));
    }
    return list;
  },
  removeFromSchedule(contestId) {
    let list = this.getSchedule();
    list = list.filter(id => id !== contestId);
    localStorage.setItem('aigc_schedule', JSON.stringify(list));
    return list;
  },
  isScheduled(contestId) {
    return this.getSchedule().includes(contestId);
  }
};

// ===== 工具函数 =====
function getContestStatus(contest) {
  const now = new Date();
  const timeline = contest.timeline;
  let deadline = null;
  for (const item of timeline) {
    if (item.title.includes('截止') || item.title.includes('提交')) {
      deadline = new Date(item.date);
      break;
    }
  }
  if (!deadline) {
    const last = timeline[timeline.length - 1];
    deadline = new Date(last.date);
  }
  const start = new Date(timeline[0].date);
  if (now < start) return { status: 'upcoming', label: '即将开始' };
  if (now <= deadline) return { status: 'open', label: '征集中' };
  return { status: 'closed', label: '已结束' };
}

function getDeadline(contest) {
  for (const item of contest.timeline) {
    if (item.title.includes('截止') || item.title.includes('提交')) {
      return new Date(item.date);
    }
  }
  return new Date(contest.timeline[contest.timeline.length - 1].date);
}

function getCountdown(deadline) {
  const now = new Date();
  const diff = deadline - now;
  if (diff <= 0) return null;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  return { days, hours, minutes };
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function updateScheduleBadge() {
  const count = Storage.getSchedule().length;
  const badge = document.getElementById('schedule-badge');
  if (count > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== 路由 =====
function navigate(view, contestId) {
  state.currentView = view;
  state.currentContestId = contestId;
  if (view === 'home') {
    location.hash = '#/';
  } else if (view === 'contest') {
    location.hash = `#/contest/${contestId}`;
  } else if (view === 'schedule') {
    location.hash = '#/schedule';
  }
  render();
  window.scrollTo(0, 0);
}

function parseHash() {
  const hash = location.hash.slice(2);
  if (hash.startsWith('contest/')) {
    const id = hash.replace('contest/', '');
    return { view: 'contest', id };
  } else if (hash === 'schedule') {
    return { view: 'schedule' };
  }
  return { view: 'home' };
}

window.addEventListener('hashchange', () => {
  const { view, id } = parseHash();
  state.currentView = view;
  state.currentContestId = id;
  render();
});

        </div>
        <div class="filter-group">
          <span class="filter-label">状态</span>
          <select class="filter-select" id="filter-status">
            <option value="all">全部</option>
            <option value="open" ${state.filterStatus === 'open' ? 'selected' : ''}>征集中</option>
            <option value="upcoming" ${state.filterStatus === 'upcoming' ? 'selected' : ''}>即将开始</option>
            <option value="closed" ${state.filterStatus === 'closed' ? 'selected' : ''}>已结束</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">地区</span>
          <select class="filter-select" id="filter-region">
            <option value="all">全部</option>
            <option value="国际" ${state.filterRegion === '国际' ? 'selected' : ''}>国际</option>
            <option value="国内" ${state.filterRegion === '国内' ? 'selected' : ''}>国内</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">类别</span>
          <select class="filter-select" id="filter-category">
            <option value="all">全部</option>
            ${categories.map(cat => `<option value="${cat}" ${state.filterCategory === cat ? 'selected' : ''}>${cat}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-number">${CONTESTS.length}</div><div class="stat-label">收录赛事</div></div>
      <div class="stat-item"><div class="stat-number">${totalWorks}</div><div class="stat-label">获奖作品</div></div>
      <div class="stat-item"><div class="stat-number">${openCount}</div><div class="stat-label">正在征集</div></div>
    </div>
    ${filtered.length === 0 ? `
      <div class="empty-state">
        <div class="empty-state-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <div class="empty-state-text">没有找到匹配的比赛，试试其他关键词或筛选条件</div>
      </div>
    ` : `<div class="contest-grid">${filtered.map(c => renderContestCard(c)).join('')}</div>`}
  `;

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    renderHome();
    const input = document.getElementById('search-input');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
  document.getElementById('filter-year').addEventListener('change', (e) => { state.filterYear = e.target.value; renderHome(); });
  document.getElementById('filter-status').addEventListener('change', (e) => { state.filterStatus = e.target.value; renderHome(); });
  document.getElementById('filter-region').addEventListener('change', (e) => { state.filterRegion = e.target.value; renderHome(); });
  document.getElementById('filter-category').addEventListener('change', (e) => { state.filterCategory = e.target.value; renderHome(); });

  filtered.forEach(c => {
    const card = document.getElementById(`card-${c.id}`);
    if (card) card.addEventListener('click', (e) => {
      if (!e.target.closest('.add-schedule-btn')) navigate('contest', c.id);
    });
    const btn = document.getElementById(`schedule-btn-${c.id}`);
    if (btn) btn.addEventListener('click', (e) => { e.stopPropagation(); toggleSchedule(c.id); });
  });
}

function renderContestCard(c) {
  const { status, label } = getContestStatus(c);
  const statusClass = status === 'open' ? 'status-open' : status === 'upcoming' ? 'status-upcoming' : 'status-closed';
  const scheduled = Storage.isScheduled(c.id);
  const deadline = getDeadline(c);
  const deadlineStr = deadline.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
  return `
    <div class="contest-card" id="card-${c.id}">
      <div class="contest-card-cover" style="background: ${c.coverGradient}">
        <div style="position:absolute;bottom:16px;left:20px;right:20px;z-index:1;">
          <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:4px;">${c.organizer} · ${c.year}</div>
        </div>
      </div>
      <div class="contest-card-body">
        <div class="contest-card-header">
          <div class="contest-card-title">${c.name}</div>
          <span class="status-badge ${statusClass}">${label}</span>
        </div>
        <div class="contest-card-meta">
          <span class="meta-tag">${c.category}</span>
          <span class="meta-tag">${c.region}</span>
          ${c.tags.slice(0, 2).map(t => `<span class="meta-tag">${t}</span>`).join('')}
        </div>
        <div class="contest-card-prize">${c.prize}</div>
        <div class="contest-card-desc">${c.description}</div>
        <div class="contest-card-footer">
          <span class="contest-card-date">截止：${deadlineStr}</span>
          <button class="add-schedule-btn ${scheduled ? 'scheduled' : ''}" id="schedule-btn-${c.id}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${scheduled ? '已加入' : '加入赛程'}
          </button>
        </div>
      </div>
    </div>
  `;
}

// ===== 渲染：比赛详情 =====
function renderContestDetail() {
  const app = document.getElementById('app');
  const contest = CONTESTS.find(c => c.id === state.currentContestId);
  if (!contest) {
    app.innerHTML = '<div class="empty-state"><div class="empty-state-text">比赛不存在</div></div>';
    return;
  }
  const { status, label } = getContestStatus(contest);
  const statusClass = status === 'open' ? 'status-open' : status === 'upcoming' ? 'status-upcoming' : 'status-closed';
  const deadline = getDeadline(contest);
  const countdown = getCountdown(deadline);
  const scheduled = Storage.isScheduled(contest.id);
  const now = new Date();

  app.innerHTML = `
    <button class="back-btn" onclick="navigate('home')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      返回列表
    </button>
    <div class="detail-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
        <div style="flex:1;min-width:200px;">
          <h1 class="detail-title">${contest.name}</h1>
          <div class="detail-organizer">主办方：${contest.organizer} · ${contest.year} · ${contest.region}</div>
        </div>
        <span class="status-badge ${statusClass}" style="font-size:13px;padding:6px 14px;">${label}</span>
      </div>
      <div class="detail-tags">
        <span class="meta-tag">${contest.category}</span>
        ${contest.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}
      </div>
      <div class="detail-prize">${contest.prize}</div>
      <p class="detail-desc">${contest.description}</p>
      <div class="detail-actions">
        <a href="${contest.website}" target="_blank" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          访问官网
        </a>
        <button class="btn-secondary" onclick="toggleSchedule('${contest.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${scheduled ? '已加入赛程' : '加入我的赛程'}
        </button>
      </div>
    </div>
    ${countdown ? `
      <div class="countdown-box">
        <div class="countdown-label">距离投稿截止还有</div>
        <div class="countdown-timer">
          <div class="countdown-unit"><div class="countdown-number">${countdown.days}</div><div class="countdown-unit-label">天</div></div>
          <div class="countdown-unit"><div class="countdown-number">${countdown.hours}</div><div class="countdown-unit-label">时</div></div>
          <div class="countdown-unit"><div class="countdown-number">${countdown.minutes}</div><div class="countdown-unit-label">分</div></div>
        </div>
      </div>
    ` : ''}
    <div class="timeline-section">
      <div class="section-title">赛事时间线</div>
      <div class="timeline">
        ${contest.timeline.map((item, i) => {
          const itemDate = new Date(item.date);
          let dotClass = '';
          if (itemDate < now) dotClass = 'completed';
          else if (i === contest.timeline.findIndex(t => new Date(t.date) >= now)) dotClass = 'current';
          return `
            <div class="timeline-item">
              <div class="timeline-date"><span class="timeline-dot ${dotClass}"></span>${item.date}</div>
              <div class="timeline-content">
                <div class="timeline-content-title">${item.title}</div>
                <div class="timeline-content-desc">${item.desc}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="works-section">
      <div class="works-header">
        <div class="section-title" style="margin-bottom:0;">获奖作品（${contest.works.length}）</div>
        ${contest.works.length > 0 ? `
        <button class="collapse-all-btn" onclick="toggleAllComments()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <span id="collapse-all-text">${state.allCollapsed ? '展开全部评论' : '折叠全部评论'}</span>
        </button>` : ''}
      </div>
      ${contest.works.length === 0 ? `
        <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px;opacity:0.5;"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <div style="font-size:14px;">获奖作品视频正在收集中</div>
          <div style="font-size:12px;margin-top:4px;">本届赛事结果公布后将补充作品链接，欢迎通过评论区提供线索</div>
        </div>
      ` : `
      <div class="works-grid">
        ${contest.works.map(w => renderWorkCard(w)).join('')}
      </div>`}
    </div>
  `;

  contest.works.forEach(w => {
    const poster = document.getElementById(`poster-${w.id}`);
    if (poster) poster.addEventListener('click', () => window.open(w.link, '_blank'));
    const commentToggle = document.getElementById(`comment-toggle-${w.id}`);
    if (commentToggle) commentToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleCommentPanel(w.id); });
    const commentSubmit = document.getElementById(`comment-submit-${w.id}`);
    if (commentSubmit) commentSubmit.addEventListener('click', () => submitComment(w.id));
    const commentInput = document.getElementById(`comment-input-${w.id}`);
    if (commentInput) commentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitComment(w.id); });
  });
}

function renderWorkCard(w) {
  const comments = Storage.getComments(w.id);
  const isOpen = state.expandedComments.has(w.id);
  return `
    <div class="work-card">
      <div class="work-poster" id="poster-${w.id}" style="background: ${w.gradient}">
        <div class="work-award-badge">${w.award}</div>
        <div class="work-play-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="#333"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <div class="work-poster-overlay">
          <div style="font-size:16px;font-weight:700;color:white;margin-bottom:2px;text-shadow:0 1px 4px rgba(0,0,0,0.5);">${w.title}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.8);">${w.author}</div>
        </div>
      </div>
      <div class="work-info">
        <div class="work-title">${w.title}</div>
        <div class="work-author">${w.author} · ${w.award}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;">${w.desc}</div>
      </div>
      <div class="comments-panel ${isOpen ? 'open' : ''}" id="comments-panel-${w.id}">
        <div class="comments-inner">
          <div class="comments-header">
            <span class="comments-count">评论 (${comments.length})</span>
            <button class="comment-toggle-btn" id="comment-toggle-${w.id}">${isOpen ? '收起 ▲' : '展开 ▼'}</button>
          </div>
          <div class="comment-input-area">
            <input type="text" class="comment-input" id="comment-input-${w.id}" placeholder="写下你的评论..." maxlength="500">
            <button class="comment-submit" id="comment-submit-${w.id}">发送</button>
          </div>
          <div class="comments-list" id="comments-list-${w.id}">
            ${comments.length === 0 ? '<div class="no-comments">暂无评论，来发表第一条吧</div>' :
              comments.map(c => `
                <div class="comment-item">
                  <div class="comment-meta"><span class="comment-author">${c.author}</span><span class="comment-time">${c.time}</span></div>
                  <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
              `).join('')
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== 评论功能 =====
function toggleCommentPanel(workId) {
  if (state.expandedComments.has(workId)) {
    state.expandedComments.delete(workId);
  } else {
    state.expandedComments.add(workId);
  }
  const panel = document.getElementById(`comments-panel-${workId}`);
  const btn = document.getElementById(`comment-toggle-${workId}`);
  if (panel) panel.classList.toggle('open');
  if (btn) btn.textContent = state.expandedComments.has(workId) ? '收起 ▲' : '展开 ▼';
}

function toggleAllComments() {
  const contest = CONTESTS.find(c => c.id === state.currentContestId);
  if (!contest) return;
  state.allCollapsed = !state.allCollapsed;
  contest.works.forEach(w => {
    if (state.allCollapsed) {
      state.expandedComments.delete(w.id);
    } else {
      state.expandedComments.add(w.id);
    }
    const panel = document.getElementById(`comments-panel-${w.id}`);
    const btn = document.getElementById(`comment-toggle-${w.id}`);
    if (panel) panel.classList.toggle('open', !state.allCollapsed);
    if (btn) btn.textContent = state.allCollapsed ? '展开 ▼' : '收起 ▲';
  });
  document.getElementById('collapse-all-text').textContent = state.allCollapsed ? '展开全部评论' : '折叠全部评论';
}

function submitComment(workId) {
  const input = document.getElementById(`comment-input-${workId}`);
  const text = input.value.trim();
  if (!text) { showToast('评论内容不能为空', 'info'); return; }
  Storage.addComment(workId, text);
  input.value = '';
  showToast('评论已发布', 'success');
  const comments = Storage.getComments(workId);
  const list = document.getElementById(`comments-list-${workId}`);
  const count = document.querySelector(`#comments-panel-${workId} .comments-count`);
  if (list) {
    list.innerHTML = comments.length === 0 ? '<div class="no-comments">暂无评论，来发表第一条吧</div>' :
      comments.map(c => `
        <div class="comment-item">
          <div class="comment-meta"><span class="comment-author">${c.author}</span><span class="comment-time">${c.time}</span></div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
  }
  if (count) count.textContent = `评论 (${comments.length})`;
}

// ===== 赛程功能 =====
function toggleSchedule(contestId) {
  if (Storage.isScheduled(contestId)) {
    Storage.removeFromSchedule(contestId);
    showToast('已从赛程移除', 'info');
  } else {
    Storage.addToSchedule(contestId);
    showToast('已加入我的赛程', 'success');
  }
  updateScheduleBadge();
  if (state.currentView === 'home') renderHome();
  else if (state.currentView === 'contest') renderContestDetail();
  else if (state.currentView === 'schedule') renderSchedule();
}

// ===== 渲染：我的赛程 =====
function renderSchedule() {
  const app = document.getElementById('app');
  const scheduleIds = Storage.getSchedule();
  const scheduledContests = CONTESTS.filter(c => scheduleIds.includes(c.id));
  app.innerHTML = `
    <div class="hero" style="padding:32px 0 24px;">
      <h1 class="hero-title" style="font-size:clamp(28px,4vw,44px);">我的赛程</h1>
      <p class="hero-subtitle">追踪你关注的比赛，不错过任何截止日期</p>
    </div>
    ${scheduledContests.length === 0 ? `
      <div class="empty-state">
        <div class="empty-state-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="empty-state-text">还没有加入任何比赛</div>
        <button class="btn-primary" style="margin-top:20px;" onclick="navigate('home')">去浏览赛事</button>
      </div>
    ` : `
      <div class="schedule-list">
        ${scheduledContests.map(c => {
          const deadline = getDeadline(c);
          const countdown = getCountdown(deadline);
          const { label } = getContestStatus(c);
          return `
            <div class="schedule-item">
              <div class="schedule-item-info" onclick="navigate('contest','${c.id}')">
                <div class="schedule-item-title">${c.name}</div>
                <div class="schedule-item-meta">${c.organizer} · 截止 ${deadline.toLocaleDateString('zh-CN')} · ${label}</div>
              </div>
              <div class="schedule-item-countdown">
                ${countdown ? `
                  <div class="schedule-countdown-number">${countdown.days}</div>
                  <div class="schedule-countdown-label">天后截止</div>
                ` : `<div class="schedule-countdown-number" style="color:var(--text-muted);font-size:16px;">已截止</div><div class="schedule-countdown-label">—</div>`}
              </div>
              <button class="schedule-remove-btn" onclick="toggleSchedule('${c.id}')">移除</button>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

// ===== 主渲染 =====
function render() {
  document.getElementById('nav-home').classList.toggle('active', state.currentView === 'home');
  document.getElementById('nav-schedule').classList.toggle('active', state.currentView === 'schedule');
  if (state.currentView === 'home') renderHome();
  else if (state.currentView === 'contest') renderContestDetail();
  else if (state.currentView === 'schedule') renderSchedule();
  updateScheduleBadge();
}

// ===== 初始化 =====
function init() {
  const { view, id } = parseHash();
  state.currentView = view;
  state.currentContestId = id;
  render();
}
init();
</script>
</body>
</html>
